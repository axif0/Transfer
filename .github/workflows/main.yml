name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LATEST_TAG="v0.0.0"
          fi

          GRADLE_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          GRADLE_TAG="v${GRADLE_NAME}"
          if [[ "$GRADLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$(printf '%s\n' "$LATEST_TAG" "$GRADLE_TAG" | sort -V | tail -1)" = "$GRADLE_TAG" ]; then
              LATEST_TAG="$GRADLE_TAG"
            fi
          fi

          MAJOR=${LATEST_TAG#v}
          MAJOR=${MAJOR%%.*}
          REST=${LATEST_TAG#v}
          REST=${REST#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          PATCH=$((PATCH + 1))

          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          sed -i "s/versionCode = [0-9]*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          mkdir -p fastlane/metadata/android/en-US/changelogs
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --format=%s "${PREV_TAG}..HEAD" | head -20 > "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          else
            echo "Release ${VERSION_NAME}" > "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${LATEST_TAG} -> ${TAG} (versionCode ${VERSION_CODE})"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decrypt keystore
        run: |
          gpg --batch --yes --passphrase "${{ secrets.GPG_PASSWORD }}" \
              -o app/keystore/transfer-key.jks \
              -d app/keystore/transfer-key.jks.gpg

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build Signed App Bundle
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts "fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          git commit -m "${{ steps.version.outputs.tag }} [skip ci]"

      - name: Push version bump
        run: git push origin HEAD:main

      - name: Upload APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
